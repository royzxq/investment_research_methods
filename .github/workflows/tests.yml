name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml

      # 测试全部离线：pandas/numpy 供 future_data.py 相关用例使用；tushare 只需可导入
      # （future_data.py 导入时检查依赖），不设置 TUSHARE_TOKEN，也不访问行情接口。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas tushare

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # framework-condense 要求的期货框架结构检查（稳定锚点、重复锚点、交叉链接）
      - name: Futures framework governance check
        run: python scripts/futures_framework_governance.py --check
